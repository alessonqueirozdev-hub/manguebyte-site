# manguebyte.org: a static site, served as it is from the folder deploy.sh
# fills. Certbot adds the HTTPS server blocks and the redirect from HTTP.

# Assets carry a hash of their contents in their address, so a browser may
# keep them for a year. Pages are checked with the server every time.
map $uri $manguebyte_cache {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    listen [::]:80;
    server_name www.manguebyte.org;
    return 301 https://manguebyte.org$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name manguebyte.org;

    root /var/www/manguebyte.org/current;
    index index.html;
    charset utf-8;
    absolute_redirect off;

    add_header Cache-Control $manguebyte_cache always;
    # The site loads nothing from anywhere else. The one image given as
    # data is the paper texture in the stylesheet.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/xml text/plain;

    location / {
        try_files $uri $uri/ =404;
        error_page 404 /404.html;
    }

    location /pt/ {
        try_files $uri $uri/ =404;
        error_page 404 /pt/404.html;
    }
}
